name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Find latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)

          if [[ -z "$LATEST" ]]; then
            VERSION="1.0.0"
          else
            VERSION="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building version $VERSION"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Rename JAR
        run: |
          mkdir -p release
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)

          if [[ -z "$JAR" ]]; then
            echo "No JAR found!"
            exit 1
          fi

          cp "$JAR" "release/Plywood-${{ steps.version.outputs.version }}.jar"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release/Plywood-${{ steps.version.outputs.version }}.jar \
            --title "Plywood ${{ steps.version.outputs.tag }}" \
            --generate-notes
